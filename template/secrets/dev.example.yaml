# Plaintext shape only. Do not put real development secrets in this file.
# Mirror this shape in the encrypted secrets/dev.yaml (SOPS + age). Each
# secret is documented here, and `just dev-env-generate` composes each
# workspace's .env.local from the three
# dev layers and any authorized broker-owned S3 pairs referenced by a plain
# layer. Keep non-secret values in config/dev.yaml — a key never lives in both
# tracked layers. This file is seeded once and then owned by your repo — extend
# it to match your real secrets; sync will not overwrite it.
brokeredReferences:
  - r2-dev:r2.dev_rw
apps:
  web:
    # Required database connection used by the web app in development.
    DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app_dev
    # Required local signing secret. Replace before generating the environment.
    AUTH_SECRET: replace-with-a-long-random-dev-secret
packages:
  db:
    # Required database connection used by the database package in development.
    DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app_dev
