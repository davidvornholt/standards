# Plaintext shape only. Do not put real CI secrets in this file.
# Mirror this shape in the encrypted secrets/ci.yaml (SOPS + age), decrypted in
# CI with the SOPS_AGE_KEY GitHub Actions secret. This file is seeded once and
# then owned by your repo — extend it to match your real secrets; sync will not
# overwrite it. The structure gate compares the plaintext key shape of this
# file and secrets/ci.yaml (without decrypting anything), so keep them
# mirrored key for key.
# The optional sync-standards.local.json automation and notifications seams
# move their selected values into purpose-specific targets and matching
# secrets/<target>.example.yaml files. Keep the default keys below only for
# workflows that have not opted into their isolation seam.
ci:
  # Full ntfy topic URL the `Notify pause` workflow pushes to when an agent
  # review cycle pauses on a question. The topic name is the only access
  # control, so make it random and unguessable.
  ntfy_topic_url: https://ntfy.sh/replace-with-a-random-unguessable-topic
  # GitHub App credentials installed only on this repository. The `Standards
  # sync` workflow mints two short-lived current-repository tokens: a branch
  # writer with Contents write and Workflows write, and a PR opener with
  # Contents read and Pull requests write. Missing credentials, unapproved App
  # permissions, or failed minting stop the workflow.
  # The `Standards` settings gate needs no credential of its own: it reads with
  # the workflow token, because a probe found an installation token sees exactly
  # the same state. Declared labels come from Issues read, rulesets ride on the
  # implicit Metadata read, and REST withholds merge settings from read-only
  # viewers and ruleset bypass actors from any installation token at any level,
  # so the gate reads both over GraphQL instead.
  # Provision this nested shape with:
  # bun standards creds add github --dest ci:ci.broker_app
  broker_app:
    app_id: replace-with-the-broker-github-app-id
    private_key: |-
      -----BEGIN RSA PRIVATE KEY-----
      replace-with-the-broker-github-app-private-key
      -----END RSA PRIVATE KEY-----
