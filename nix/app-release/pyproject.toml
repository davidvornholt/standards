[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "app-release"
version = "1.0.0"
description = "Zero-downtime app releases for NixOS hosts"
requires-python = ">=3.13"
dependencies = ["cryptography", "pyjwt"]

[project.scripts]
app-release = "app_release.cli:main"
app-release-ssh = "app_release.cli:ssh_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_release = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The formatter owns these.
  "COM812",
  "ISC001",
  # Docstrings on every private helper add noise; public entry points carry them.
  "D",
  # The CLI talks to operators and CI through stdout by design.
  "T201",
  # Subprocess calls always pass argument lists with pinned executables.
  "S603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # unittest assertions and fixtures.
  "PT",
  "S101",
  "S105",
  "S106",
  "PLR2004",
  "SLF001",
  "ANN401",
]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
