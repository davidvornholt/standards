# Canonical Dependabot baseline, synced read-only from davidvornholt/standards.
# `bun standards sync` (or `bun standards dependabot --write`) composes this
# file with the repo-owned .github/dependabot.local.yml into the generated
# .github/dependabot.yml. Template-wide version holds live here so adding or
# lifting one is a single upstream change that reaches every consumer on its
# next sync; never hand-edit holds downstream.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    # Standards auto-merge merges minor and patch updates once `check` passes,
    # without review. Holding each version update until its release is three
    # days old gives the registry and maintainers time to pull a compromised
    # release first. Dependabot's own default is the same; this pins it.
    # Security updates ignore cooldown and still open immediately.
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
    ignore:
      # Not a temporary hold: biome.base.jsonc is authored against the exact
      # Biome 2.5.15 pin, so consumers never self-bump it. Upgrades happen
      # in the standards template and roll out through sync.
      - dependency-name: "@biomejs/biome"
      # Temporary hold: Next.js does not support TypeScript releases above
      # 7.0.x. Lift here when Next declares support.
      - dependency-name: "typescript"
        versions: [">7.0.2"]
    groups:
      # Effect packages release in lockstep and peer-depend on the matching
      # `effect` version, so update them in one pull request. A major update
      # arrives the same way and fails CI until someone migrates the
      # repository; that open pull request is the reminder to do it.
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      # Dependabot puts an update in the first group it matches, so this group
      # must stay after `effect` to keep every Effect update, majors included,
      # in that group.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    # Same supply-chain hold as the bun block above.
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
