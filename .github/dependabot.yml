# (canonical) with .github/dependabot.local.yml (repo-owned) into this file.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@biomejs/biome"
      - dependency-name: "typescript"
        versions:
          - ">7.0.2"
      - dependency-name: "effect"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@effect/*"
        update-types:
          - "version-update:semver-major"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      flake-inputs:
        patterns:
          - "*"
