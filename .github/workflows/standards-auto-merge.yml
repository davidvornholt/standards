name: Standards auto-merge

# Bot pull requests merge themselves once the ruleset's required `check`
# passes: Dependabot minor and patch version updates, which this workflow
# enables, and the Standards sync pull request, which standards-sync.yml
# enables. Major updates, updates without a semantic version such as Nix flake
# inputs, and every other pull request stay manual. Synced from
# davidvornholt/standards.
#
# The broker App in ci.broker_app, not the workflow token, enables auto-merge
# and updates branches. GitHub starts no workflow for events the workflow token
# causes, so its merges would start no push run on main, which release gates
# wait for, and its branch updates would leave the new head without `check`.
#
# The ruleset also requires a branch to be up to date with main, and
# Dependabot rebases its pull requests only when they conflict. After each
# push to main, the `update` job therefore merges main into every open pull
# request whose auto-merge the broker App enabled, so `check` runs on the
# updated head and the merge can proceed.

on:
  # pull_request_target runs this file from the default branch with access to
  # secrets, and no job here checks out or runs pull request content. Public
  # repositories must allow this event for this workflow in an Actions event
  # policy; see the standards-sync skill's GitHub reference.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Decides auto-merge for each Dependabot update to the default branch. A
  # push by a person makes the pull request manual. Pushes by other bots,
  # which include the broker App's own branch updates, keep the decision.
  dependabot:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event.action != 'synchronize' || github.event.sender.login == 'dependabot[bot]' || github.event.sender.type != 'Bot')
    # Repository/organization variable; empty keeps repository-scoped secrets.
    # See the standards-sync skill reference for environment-scoped bootstrap.
    environment: ${{ vars.CI_SECRETS_ENVIRONMENT }}
    # The job token only lets dependabot/fetch-metadata read the pull request
    # and its commits. The broker App token makes every change.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ vars.CI_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}-small', vars.CI_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 10
    # A newer event for the same pull request decides from newer state.
    concurrency:
      group: standards-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The default ref of pull_request_target is the base branch, so this
      # reads only trusted files: the secret action and the encrypted secrets.
      - name: Checkout trusted secret inputs
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/sops-secret
            secrets/ci.yaml
          sparse-checkout-cone-mode: false

      - name: Resolve broker App client ID
        id: broker-app-client-id
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.client_id

      - name: Resolve broker App private key
        id: broker-app-private-key
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.private_key

      # Enabling auto-merge needs the merge permissions themselves, and
      # GitHub refuses App merges that change .github/workflows/** without
      # the separate Workflows grant; GitHub Actions updates change exactly
      # those files. The token is minted before the metadata check so a
      # failed check can still turn auto-merge off below.
      - name: Mint current-repository merge token
        id: merge-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.broker-app-client-id.outputs.value }}
          private-key: ${{ steps.broker-app-private-key.outputs.value }}
          # Omitting owner and repositories is the action's exact
          # current-repository scope; never derive either from event payload.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # Fails unless Dependabot opened the pull request and wrote and signed
      # its head commit, so it never runs after a push by a person.
      - name: Read Dependabot update metadata
        id: metadata
        if: github.event.action != 'synchronize' || github.event.sender.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3

      # Runs after a failed metadata check too, and then turns auto-merge off.
      # It turns off only auto-merge the broker App enabled, so a person's
      # decision to merge a major update automatically stands.
      - name: Apply the auto-merge decision
        if: ${{ !cancelled() && steps.merge-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          APP_SLUG: ${{ steps.merge-token.outputs.app-slug }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live=$(gh pr view "$PR_URL" --json state,headRefOid,autoMergeRequest \
            --jq '[.state, .headRefOid, (.autoMergeRequest.enabledBy.login // "")] | @tsv')
          IFS=$'\t' read -r state head enabled_by <<<"$live"
          if [ "$state" != OPEN ]; then
            echo "The pull request is no longer open; nothing to decide."
            exit 0
          fi
          if [ "$EVENT_ACTION" = synchronize ] && [ "$EVENT_SENDER" != "dependabot[bot]" ]; then
            reason="$EVENT_SENDER pushed to the Dependabot branch"
          elif [ "$METADATA_OUTCOME" != success ]; then
            reason="dependabot/fetch-metadata did not verify this Dependabot update"
          else
            case "$UPDATE_TYPE" in
              version-update:semver-minor | version-update:semver-patch)
                if [ -n "$enabled_by" ]; then
                  echo "Auto-merge is already enabled by $enabled_by."
                elif [ "$head" != "$PR_HEAD" ]; then
                  echo "The head moved from $PR_HEAD to $head; the run for that push decides."
                else
                  gh pr merge "$PR_URL" --auto --squash
                  echo "Enabled auto-merge for a $UPDATE_TYPE update."
                fi
                exit 0
                ;;
            esac
            reason="its update type is ${UPDATE_TYPE:-not a semantic version}"
          fi
          if [ "$enabled_by" = "$APP_SLUG" ]; then
            gh pr merge "$PR_URL" --disable-auto
            echo "::notice::Turned auto-merge off because $reason."
          else
            echo "Left this pull request manual because $reason."
          fi

  # Lists the pull requests that the update job may bring up to date, with the
  # workflow token, so a push without any skips the broker App entirely. Pull
  # requests whose checks failed wait for a person instead of rerunning them.
  pending:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ vars.CI_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}-small', vars.CI_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      pull-requests: ${{ steps.list.outputs.pull-requests }}
    steps:
      - name: List bot auto-merge pull requests
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pages=$(gh api graphql --paginate \
            -f owner="$OWNER" -f name="$REPOSITORY" -f base="$BASE_REF" \
            -f query='
              query($owner: String!, $name: String!, $base: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequests(states: OPEN, baseRefName: $base, first: 100, after: $endCursor) {
                    nodes {
                      number
                      headRefName
                      isCrossRepository
                      author { login }
                      autoMergeRequest { enabledBy { __typename login } }
                      commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }')
          pull_requests=$(jq -sc '[.[].data.repository.pullRequests.nodes[]
            | select((.isCrossRepository | not)
              and .autoMergeRequest.enabledBy.__typename == "Bot"
              and ((.commits.nodes[0].commit.statusCheckRollup.state // "")
                | IN("FAILURE", "ERROR") | not))
            | {number, headRefName, author: (.author.login // ""), enabledBy: .autoMergeRequest.enabledBy.login}]' <<<"$pages")
          echo "pull-requests=$pull_requests" >> "$GITHUB_OUTPUT"

  update:
    needs: pending
    if: needs.pending.outputs.pull-requests != '[]'
    # Repository/organization variable; empty keeps repository-scoped secrets.
    # See the standards-sync skill reference for environment-scoped bootstrap.
    environment: ${{ vars.CI_SECRETS_ENVIRONMENT }}
    permissions:
      contents: read
    runs-on: ${{ vars.CI_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}-small', vars.CI_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 10
    # A newer push to main brings the same pull requests further up to date.
    concurrency:
      group: standards-auto-merge-update
      cancel-in-progress: true
    steps:
      - name: Checkout trusted secret inputs
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/sops-secret
            secrets/ci.yaml
          sparse-checkout-cone-mode: false

      - name: Resolve broker App client ID
        id: broker-app-client-id
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.client_id

      - name: Resolve broker App private key
        id: broker-app-private-key
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.private_key

      # A merge from main brings main's workflow changes along, which GitHub
      # accepts from an App only with the separate Workflows grant.
      - name: Mint current-repository branch updater token
        id: updater-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.broker-app-client-id.outputs.value }}
          private-key: ${{ steps.broker-app-private-key.outputs.value }}
          # Omitting owner and repositories is the action's exact
          # current-repository scope; never derive either from event payload.
          permission-contents: write
          permission-workflows: write

      # Updates only pull requests whose auto-merge the broker App enabled:
      # Dependabot's, and the sync pull request the same App opened. The merge
      # commit message carries `[dependabot skip]`, so Dependabot still
      # force-pushes over it when it rebases or recreates its update. A clean
      # merge from main is also the one foreign commit the next Standards sync
      # may drop when it rebuilds its branch. A conflict waits for Dependabot
      # or the next sync, which both resolve their own conflicts.
      - name: Merge main into pull requests waiting to auto-merge
        env:
          GH_TOKEN: ${{ steps.updater-token.outputs.token }}
          APP_SLUG: ${{ steps.updater-token.outputs.app-slug }}
          PULL_REQUESTS: ${{ needs.pending.outputs.pull-requests }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.ref_name }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          targets=$(jq -r --arg app "$APP_SLUG" '.[]
            | select(.enabledBy == $app
              and (.author == "dependabot"
                or (.author == $app and .headRefName == "standards-sync/update")))
            | [.number, .headRefName] | @tsv' <<<"$PULL_REQUESTS")
          failed=
          while IFS=$'\t' read -r number branch; do
            [ -n "$number" ] || continue
            response=$(gh api --include --method POST "repos/$REPOSITORY/merges" \
              -f base="$branch" -f head="$BASE_SHA" \
              -f commit_message="Merge $BASE_REF into $branch [dependabot skip]") || true
            status=$(head -n 1 <<<"$response" | cut -d ' ' -f 2)
            case "$status" in
              201) echo "Merged $BASE_REF at $BASE_SHA into #$number." ;;
              204) echo "#$number already contains $BASE_SHA." ;;
              404) echo "::notice::The branch of #$number no longer exists." ;;
              409) echo "::warning::#$number conflicts with $BASE_REF. It waits for Dependabot or the next Standards sync to resolve the conflict." ;;
              *)
                echo "::error::Could not merge $BASE_REF into #$number: $(head -n 1 <<<"$response")"
                failed=true
                ;;
            esac
          done <<<"$targets"
          [ -z "$failed" ]
