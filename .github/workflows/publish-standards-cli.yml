name: Publish standards CLI

# A reviewed version in the package manifest is the release declaration. Wait
# for the canonical quality gate to finish so publishing is hard-gated on the
# exact main-branch commit that is packaged and tagged.
on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  PACKAGE_NAME: "@davidvornholt/standards"
  PACKAGE_PATH: packages/standards-cli/package.json

concurrency:
  group: publish-standards-cli
  queue: max
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for the exact commit quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for _attempt in $(seq 1 240); do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/standards.yml/runs?head_sha=$RELEASE_SHA&event=push&branch=main&per_page=100")"
            run="$(jq -c --arg sha "$RELEASE_SHA" --arg repo "$GH_REPO" '
              [.workflow_runs[] | select(
                .head_sha == $sha and .event == "push" and
                .head_branch == "main" and .head_repository.full_name == $repo and
                .path == ".github/workflows/standards.yml"
              )] | max_by(.id) // null' <<<"$runs")"
            if [[ "$run" != "null" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              if [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]; then
                echo "Standards passed for $RELEASE_SHA"
                exit 0
              fi
              echo "::error::Standards did not pass for $RELEASE_SHA"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Standards at $RELEASE_SHA"
          exit 1

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      declared: ${{ steps.declaration.outputs.declared }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ github.sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify tested commit is on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Tested commit $RELEASE_SHA is not on main"
            exit 1
          fi

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # The release is the merge commit that changes the manifest version. A
      # commit that inherits or withdraws a version an earlier commit declared
      # releases nothing itself, so it publishes nothing and contacts no
      # registry; the guards below only check that the release it stands on
      # actually completed, from tags and the read-only GitHub release API.
      - name: Determine release declaration
        id: declaration
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="$(jq -er '.version | select(type == "string")' "$PACKAGE_PATH")"
          parent="$(git rev-parse --verify "$RELEASE_SHA^" 2>/dev/null || true)"
          if [[ -z "$parent" ]]; then
            echo "::error::Tested commit $RELEASE_SHA has no parent to compare its release declaration against"
            exit 1
          fi
          show_error="$RUNNER_TEMP/git-show-parent-manifest.err"
          if ! previous_manifest="$(git show "$parent:$PACKAGE_PATH" \
            2>"$show_error")"; then
            echo "::error::Cannot read $PACKAGE_PATH at parent commit $parent: $(<"$show_error")"
            exit 1
          fi
          previous_version="$(jq -er '.version | select(type == "string")' \
            <<<"$previous_manifest")"
          declaration_action="$(node \
            packages/standards-cli/scripts/release-recovery.ts \
            declaration "$version" "$previous_version")"
          withdrawn_version=
          case "$declaration_action" in
            declared) declared=true ;;
            unchanged)
              declared=false
              echo "$PACKAGE_PATH still declares $version; no release to publish"
              ;;
            withdrawn)
              declared=false
              withdrawn_version="$previous_version"
              echo "$PACKAGE_PATH withdrew $previous_version back to $version; no release to publish"
              ;;
            *)
              echo "::error::Unexpected release declaration action: $declaration_action"
              exit 1
              ;;
          esac
          {
            echo "declared=$declared"
            echo "version=$version"
            echo "withdrawn_version=$withdrawn_version"
          } >>"$GITHUB_OUTPUT"

      # An inherited version whose own release never completed would otherwise
      # be skipped in silence by every later commit. Both the tag and published
      # Release must exist; a tag alone is the recoverable tag-only state.
      - name: Verify the inherited release completed
        if: steps.declaration.outputs.declared == 'false'
        env:
          VERSION: ${{ steps.declaration.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::$PACKAGE_PATH declares $VERSION but tag v$VERSION does not exist, so that release never completed. If $VERSION reached npm, re-run the declaring commit's failed Publish standards CLI run: it verifies the published provenance and writes the tag. If it did not, that version is spent, so declare a new version on current main."
            exit 1
          fi

          tag_sha="$(git rev-list -n 1 "v$VERSION")"
          release_state=tag-only
          if is_draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"; then
            if [[ "$is_draft" == "false" ]]; then
              release_state=published
            else
              release_state=draft
            fi
          fi
          action="$(node packages/standards-cli/scripts/release-recovery.ts \
            github-state "$release_state" "$tag_sha" "$tag_sha")"
          if [[ "$action" != "none" ]]; then
            echo "::error::Release v$VERSION is incomplete despite its tag. Re-run the declaring commit's failed Publish standards CLI run to reconcile the GitHub Release."
            exit 1
          fi

      # A revert withdraws its parent's declaration, and no later commit ever
      # mentions that version again. Whether it reached npm before its release
      # job died cannot be told from this checkout, so an untagged withdrawal is
      # ambiguous rather than clean and has to fail closed here.
      - name: Verify the withdrawn release completed
        if: steps.declaration.outputs.withdrawn_version != ''
        env:
          WITHDRAWN_VERSION: ${{ steps.declaration.outputs.withdrawn_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/v$WITHDRAWN_VERSION" \
            >/dev/null; then
            echo "::error::This commit withdraws $WITHDRAWN_VERSION but tag v$WITHDRAWN_VERSION does not exist, so that release never completed. Check the npm registry for $PACKAGE_NAME@$WITHDRAWN_VERSION: if it is published, re-run the failed Publish standards CLI run of the commit that declared $WITHDRAWN_VERSION, whose frozen GITHUB_SHA still names that commit, so it verifies the published provenance and reconciles both the tag and the Release; if it is not, $WITHDRAWN_VERSION is free to declare again."
            exit 1
          fi

          tag_sha="$(git rev-list -n 1 "v$WITHDRAWN_VERSION")"
          release_state=tag-only
          if is_draft="$(gh release view "v$WITHDRAWN_VERSION" --json isDraft --jq .isDraft)"; then
            if [[ "$is_draft" == "false" ]]; then
              release_state=published
            else
              release_state=draft
            fi
          fi
          action="$(node packages/standards-cli/scripts/release-recovery.ts \
            github-state "$release_state" "$tag_sha" "$tag_sha")"
          if [[ "$action" != "none" ]]; then
            echo "::error::Release v$WITHDRAWN_VERSION is incomplete despite its tag. Re-run the declaring commit's failed Publish standards CLI run to reconcile the GitHub Release."
            exit 1
          fi

      - name: Setup Bun
        if: steps.declaration.outputs.declared == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install release dependencies
        if: steps.declaration.outputs.declared == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      # The declaration step already proved the version is a stable SemVer, so
      # this step consumes that value instead of re-validating its shape.
      - name: Determine release state
        id: release
        if: steps.declaration.outputs.declared == 'true'
        env:
          VERSION: ${{ steps.declaration.outputs.version }}
        run: |
          name="$(jq -er '.name | select(type == "string")' "$PACKAGE_PATH")"
          if [[ "$name" != "$PACKAGE_NAME" ]]; then
            echo "::error::$PACKAGE_PATH name must be $PACKAGE_NAME; received $name"
            exit 1
          fi

          version="$VERSION"

          encoded_name="${PACKAGE_NAME/@/%40}"
          encoded_name="${encoded_name//\//%2F}"
          metadata="$(curl --fail --silent --show-error \
            "https://registry.npmjs.org/$encoded_name")"
          latest="$(jq -er '.["dist-tags"].latest' <<<"$metadata")"

          npm_version="$(npm --version)"
          if ! bun -e \
            'if (Bun.semver.order(process.argv[1], "11.5.1") < 0) process.exit(1)' \
            "$npm_version"; then
            echo "::error::npm 11.5.1 or newer is required for trusted publishing"
            exit 1
          fi

          if jq -e --arg version "$version" '.versions[$version] != null' \
            <<<"$metadata" >/dev/null; then
            exact_version_exists=true
          else
            exact_version_exists=false
          fi
          release_action="$(node \
            packages/standards-cli/scripts/release-recovery.ts \
            npm-state "$version" "$latest" "$exact_version_exists")"
          case "$release_action" in
            publish) publish=true ;;
            recover) publish=false ;;
            *)
              echo "::error::Unexpected npm release action: $release_action"
              exit 1
              ;;
          esac

          {
            echo "tag=v$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

      # The push event freezes GITHUB_SHA to the declaring commit even if main
      # advances while its quality gate runs. Keep the provenance equality
      # assertion as a final precondition before packing or publishing.
      - name: Verify the declaring commit matches provenance
        if: steps.release.outputs.publish == 'true'
        env:
          PROVENANCE_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          packaged_sha="$(git rev-parse HEAD)"
          if [[ "$PROVENANCE_SHA" != "$RELEASE_SHA" || "$packaged_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::npm provenance would attest $PROVENANCE_SHA but checkout $packaged_sha does not match the tested release commit $RELEASE_SHA."
            exit 1
          fi

      - name: Pack and inspect package
        id: package
        if: steps.release.outputs.publish == 'true'
        run: |
          artifact_dir="$RUNNER_TEMP/standards-cli-package"
          mkdir "$artifact_dir"
          bun pm pack \
            --cwd packages/standards-cli \
            --destination "$artifact_dir" \
            --ignore-scripts

          mapfile -t artifacts < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi
          tar -tzf "${artifacts[0]}"
          echo "artifact=${artifacts[0]}" >>"$GITHUB_OUTPUT"

      - name: Publish package
        if: steps.release.outputs.publish == 'true'
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.artifact }}
        run: >-
          npm publish "$PACKAGE_TARBALL"
          --ignore-scripts
          --provenance
          --access public
          --tag latest
          --registry=https://registry.npmjs.org

      # Reached when the declaring commit already published to npm and a later
      # step failed. Nothing is published on this path, so the tip check does not
      # run and the attested commit is not this run's to control: verifying that
      # the published attestation names RELEASE_SHA is what binds the tag and
      # Release this run is about to assert.
      - name: Verify existing package provenance
        if: steps.release.outputs.publish == 'false'
        env:
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.declaration.outputs.version }}
        run: |
          audit_dir="$RUNNER_TEMP/standards-cli-provenance-audit"
          npm install \
            --prefix "$audit_dir" \
            --ignore-scripts \
            --save-exact \
            --registry=https://registry.npmjs.org \
            "$PACKAGE_NAME@$VERSION"
          npm audit signatures --prefix "$audit_dir"
          package_path="node_modules/$PACKAGE_NAME"
          installed_version="$(jq -er --arg path "$package_path" \
            '.packages[$path].version | select(type == "string")' \
            "$audit_dir/package-lock.json")"
          if [[ "$installed_version" != "$VERSION" ]]; then
            echo "::error::Installed $PACKAGE_NAME version $installed_version, expected $VERSION"
            exit 1
          fi
          installed_integrity="$(jq -er --arg path "$package_path" \
            '.packages[$path].integrity | select(type == "string")' \
            "$audit_dir/package-lock.json")"

          encoded_name="${PACKAGE_NAME/@/%40}"
          encoded_name="${encoded_name//\//%2F}"
          attestations_file="$RUNNER_TEMP/standards-cli-attestations.json"
          curl --fail --silent --show-error \
            "https://registry.npmjs.org/-/npm/v1/attestations/$encoded_name@$VERSION" \
            >"$attestations_file"
          node packages/standards-cli/scripts/release-recovery.ts \
            provenance \
            "$attestations_file" \
            "$PACKAGE_NAME" \
            "$VERSION" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_WORKFLOW_REF" \
            "$RELEASE_SHA" \
            "$installed_integrity" \
            "$RUNNER_TEMP/standards-cli-sigstore-tuf"

  release:
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.declared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.publish.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Reconcile GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.publish.outputs.sha }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          release_state=missing
          tag_sha=
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" == "true" ]]; then
              release_state=draft
            else
              release_state=published
              git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" \
            >/dev/null 2>&1; then
            release_state=tag-only
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          fi

          action="$(bun packages/standards-cli/scripts/release-recovery.ts \
            github-state "$release_state" "$tag_sha" "$RELEASE_SHA")"
          case "$action" in
            none)
              echo "$RELEASE_TAG already exists at the tested commit"
              exit 0
              ;;
            create) ;;
            *)
              echo "::error::Unexpected release reconciliation action: $action"
              exit 1
              ;;
          esac

          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG"
