name: Standards

on:
  # Every pull request runs the gate regardless of its base branch: stacked
  # pull requests need check runs on each layer's own commits, both as review
  # signal before an atomic stack merge and because required-check rulesets
  # refuse commits that carry no runs.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Canonical quality gate synced from davidvornholt/standards. `bun run check`
  # runs the sync drift-check first, then lint, types, tests, build, and the
  # browser a11y suite. This is meant to be a consumer's WHOLE quality gate; a
  # repo with a deploy pipeline keeps that in its own workflow and stops running
  # the gate there (see the adoption notes in the standards README).
  #
  # A Postgres service is always provisioned because the mandatory a11y gate
  # renders real routes, and on this stack routes are Server Components that
  # query the database at request time — without a live DB they throw before Axe
  # can scan them. Repos with no database simply never connect to it (an idle
  # service container costs a few seconds and nothing else); making it
  # conditional would fork this file per-repo and defeat a single uniform gate.
  #
  # Per-repo DB coordinates come from repository Actions VARIABLES (Settings →
  # Secrets and variables → Actions → Variables), not edits to this synced file:
  #   CI_POSTGRES_USER, CI_POSTGRES_PASSWORD, CI_POSTGRES_DB  (defaults below)
  #   CI_RUNNER  — override only the unprivileged quality runner label when
  #                CI_CODEBUILD_PROJECT is absent
  #   CI_CODEBUILD_PROJECT — in a sole-maintainer personal repository that
  #                trusts workflow edits before merge, select an ephemeral AWS
  #                CodeBuild runner for every compatible canonical consumer job;
  #                this takes precedence over CI_RUNNER and adds the unique run
  #                identity CodeBuild requires
  #   CI_CODEBUILD_QUALITY_SIZE — override the CodeBuild quality job's instance
  #                size when a measured gate cannot run reliably on `medium`;
  #                compatible values are CodeBuild's runner size labels
  # The canonical contract test is a merge-time ratchet against accidental
  # routing changes, not runtime authorization for requests to CodeBuild.
  # The Standards-only architecture matrix keeps its native runner mapping.
  # These are non-secret configuration; leaking them enables nothing.
  #
  # Playwright's Chromium, unlike the Postgres service, is installed only when the
  # repo actually has a browser a11y suite (a playwright.config.* or *.a11y.ts
  # spec). Two asymmetries justify the difference: the install is an active
  # per-run download rather than an idle service container, and a step can carry
  # an `if:` whereas a service cannot. So gating it keeps one uniform file while
  # skipping a pointless download in repos with nothing to render.
  quality:
    runs-on: ${{ vars.CI_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}-{3}', vars.CI_CODEBUILD_PROJECT, github.run_id, github.run_attempt, vars.CI_CODEBUILD_QUALITY_SIZE || 'medium') || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      postgres:
        # CodeBuild runners share an outbound address, so anonymous Docker Hub
        # pulls can exhaust the shared limit before the job reaches checkout.
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER || 'app' }}
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'app' }}
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB || 'app' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.CI_POSTGRES_USER || 'app' }} -d ${{ vars.CI_POSTGRES_DB || 'app' }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Workflows are the one file class the rest of the gate never exercises —
      # a broken workflow only fails when its trigger fires, after merge. Lint
      # them first: it is the cheapest step, so certain failures cost nothing.
      - name: Lint workflows
        run: |
          set -euo pipefail
          version=1.7.12
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64) arch=arm64; sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *)
              echo "::error::No pinned actionlint binary for runner architecture $(uname -m)"
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sfLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_${arch}.tar.gz"
          echo "$sha  $archive" | sha256sum --check --quiet
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # A fixed 127.0.0.1 database URL only works where the job shares the
      # service's published loopback — true on GitHub-hosted runners, false on
      # CodeBuild, whose runner is itself an unprivileged container beside the
      # service, so the published port lands on the build host instead. The
      # service stays reachable there on its container address or the docker
      # network gateway. Resolving the endpoint at runtime keeps one uniform
      # file for both topologies and fails closed with a named error here
      # instead of letting the first database consumer time out mid-gate.
      - name: Resolve the database endpoint
        env:
          CI_POSTGRES_USER: ${{ vars.CI_POSTGRES_USER || 'app' }}
          CI_POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'app' }}
          CI_POSTGRES_DB: ${{ vars.CI_POSTGRES_DB || 'app' }}
        run: |
          set -euo pipefail
          reachable() {
            timeout 2 bash -c "exec 3<>/dev/tcp/$1/5432" 2>/dev/null
          }
          candidates=()
          if [ -n "${CODEBUILD_BUILD_ID:-}" ]; then
            service_container=$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:18-alpine --format '{{.ID}}' | head -n 1)
            if [ -n "$service_container" ]; then
              service_networks=$(docker inspect "$service_container" \
                --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{.Gateway}} {{end}}')
              read -r -a service_addresses <<<"$service_networks"
              candidates+=("${service_addresses[@]}")
            fi
            candidates+=("$(docker network inspect bridge \
              --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null || true)")
            candidates+=("$(ip route show default 2>/dev/null \
              | awk '{ for (i = 1; i < NF; i++) if ($i == "via") print $(i + 1) }' | head -n 1)")
          else
            candidates=(127.0.0.1)
          fi
          for candidate in "${candidates[@]}"; do
            if [ -n "$candidate" ] && reachable "$candidate"; then
              echo "Database endpoint: $candidate:5432"
              printf 'DATABASE_URL=postgresql://%s:%s@%s:5432/%s\n' \
                "$CI_POSTGRES_USER" "$CI_POSTGRES_PASSWORD" "$candidate" "$CI_POSTGRES_DB" \
                >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No candidate endpoint reached the Postgres service (tried: ${candidates[*]})"
          exit 1

      # The canonical justfile and secrets.just are gate-tested: the source
      # repository's CLI suite spawns `just` against them, and one uniform file
      # serves every repo (see the Postgres note above).
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.57.0"

      - name: Detect browser a11y suite
        id: a11y
        run: |
          if find . -path ./node_modules -prune -o \
            \( -name 'playwright.config.*' -o -name '*.a11y.ts' \) -print | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Bun version
        id: bun
        run: |
          set -euo pipefail
          if ! package_manager="$(jq -er '.packageManager | select(type == "string" and test("^bun@(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' package.json)"; then
            echo '::error::package.json packageManager must pin an exact bun@x.y.z version'
            exit 1
          fi
          echo "version=${package_manager#bun@}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Verify Bun version
        env:
          EXPECTED_BUN_VERSION: ${{ steps.bun.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(bun --version)"
          if [[ "$actual" != "$EXPECTED_BUN_VERSION" ]]; then
            echo "::error::Expected Bun $EXPECTED_BUN_VERSION from package.json, received $actual"
            exit 1
          fi

      # Bun is the package manager and default runtime. Some quality tools and
      # cross-runtime tests intentionally invoke Node, so honor the version the
      # canonical package manifest declares instead of the runner's ambient one.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # PRs may restore the latest default-branch Turbo snapshot but never
      # publish cache state. A successful default-branch run saves at most one
      # pruned snapshot per commit, so reruns cannot duplicate an upload and PR
      # revisions cannot consume repository cache quota.
      - name: Restore the Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-

      # Bun's package store and Playwright's browser store hold executable
      # content and live at their tool-default paths. The defaults matter
      # beyond convention: Turbo runs tasks in strict env mode, so a task's
      # own spawned tools (a test that shells out to bun or launches a
      # browser) see no redirected path variables and resolve the defaults —
      # a relocated store is invisible to exactly the processes that need it.
      # Trust comes from publication, not location: pull requests may restore
      # trusted snapshots but cannot publish; only a successful main run
      # saves. A persistent self-hosted runner's user-level cache reuse is a
      # property of that runner pool, tracked upstream, and is not fixable
      # here without breaking the strict-env seam.
      #
      # Published Bun and Playwright snapshots must be history-free. A main
      # snapshot published after a lock change contains only what the current
      # lock's tooling produced from an empty store. Bun accumulates unreachable
      # packages in a restored store. Playwright garbage collection is not
      # reliable across version downgrades because an older permitted CLI
      # cannot identify browser families introduced by a newer release. Main
      # therefore restores both stores by exact lock key only: each conditional
      # `restore-keys` resolves to an empty string on main, which actions/cache
      # treats as no fallback keys. An unchanged lock still exact-hits. After a
      # lock change, the cold install runs against an empty store and the
      # successful run publishes only that result. Pull requests keep prefix
      # fallbacks because they consume trusted snapshots but never publish.
      - name: Restore the Bun package cache
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('bun-packages-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run the *installed* binary, never `bunx playwright`: a11y suites live in
      # a workspace, Bun keeps that workspace's binaries under it rather than at
      # the repo root, so bunx would find nothing there and silently resolve the
      # npm-latest CLI instead. That CLI downloads the browser build matching
      # itself, not the one the pinned @playwright/test launches, and every spec
      # then fails on a missing executable the moment upstream ships a release.
      - name: Restore the Playwright browser cache
        if: steps.a11y.outputs.present == 'true'
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('playwright-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install Playwright Chromium
        if: steps.a11y.outputs.present == 'true'
        run: |
          set -euo pipefail
          playwright=$(find . -path '*/node_modules/.bin/playwright' -print -quit)
          if [ -z "$playwright" ]; then
            echo "::error::Found a browser a11y suite but no installed playwright binary. Declare @playwright/test in the workspace that owns the suite."
            exit 1
          fi
          "$playwright" install --with-deps chromium

      - name: Check
        env:
          # The isolated `check` aggregator job owns this live check
          # in CI. This workflow-only seam keeps local `bun run check`
          # fail-closed.
          STANDARDS_SKIP_GITHUB_CHECK: "true"
        run: bun run check

      - name: Save the Bun package cache
        if: success() && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Save the Playwright browser cache
        if: success() && github.ref == 'refs/heads/main' && steps.a11y.outputs.present == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      # Keep the newest artifacts within 2 GiB before the successful
      # default-branch save. Failed, cancelled, PR, and exact-key rerun jobs do
      # not prune because none of them publishes a snapshot.
      - name: Prune the Turbo cache before save
        if: success() && github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cache_dir=.turbo/cache
          [ -d "$cache_dir" ] || exit 0
          find "$cache_dir" -type f -printf '%T@\t%k\t%p\n' |
            sort -rn |
            awk -F'\t' -v budget=$((2 * 1024 * 1024)) \
              '{ total += $2; if (total > budget) print $3 }' |
            xargs -r rm -f --

      - name: Save the Turbo cache
        if: success() && github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  nix-discovery:
    if: github.repository == 'davidvornholt/standards'
    runs-on: ${{ vars.CI_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}-small', vars.CI_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Discover Nix matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(jq -cer -f nix/bun-system-matrix.jq nix/bun-system-metadata.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix:
    name: Nix (${{ matrix.system }})
    if: github.repository == 'davidvornholt/standards'
    needs: nix-discovery
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-discovery.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Test Nix system metadata
        run: bash nix/bun-system-metadata.test.sh

      - name: Build Nix check
        run: nix build ".#checks.${{ matrix.system }}.standards-cli" -L

  # Keep the stable required-check name while making all independent gates
  # mandatory. `always()` ensures a failed or cancelled dependency cannot turn
  # this required check into a skipped success. The source repository owns the
  # Nix release gate; every consumer must skip both source-only jobs.
  #
  # The live settings comparison runs here, with the workflow token and no
  # durable credential at all. A probe against a private repository compared
  # every read this gate performs — list rulesets, get each ruleset, list
  # labels, and the GraphQL merge-settings and bypass-actor query — across a
  # broker App installation token and a token carrying exactly this job's
  # grants, and the answers were identical, including the fields GitHub
  # withholds from both. Minting a broker token here would therefore add no
  # visibility while decrypting the one durable App key that every consumer
  # keeps for the weekly sync, so this job never touches it. The checkout
  # carries the declarative settings inputs and nothing else, and the CLI that
  # consumes the token is a published, checksum-pinned artifact installed under
  # RUNNER_TEMP from direct, checksum-pinned release URLs, so a pull request
  # cannot substitute the code that performs the comparison. The comparison
  # shares this aggregator job instead of owning one because both run on the
  # same permissionless runner with only the workflow token and no repository
  # executable code, and a per-run job below sixty seconds of work still bills
  # a full runner minute in every consumer.
  check:
    if: always()
    needs:
      - quality
      - nix-discovery
      - nix
    runs-on: ${{ vars.CI_CODEBUILD_PROJECT != '' && format('codebuild-{0}-{1}-{2}-small', vars.CI_CODEBUILD_PROJECT, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout settings inputs
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/settings.json
            .github/settings.local.json
          sparse-checkout-cone-mode: false

      - name: Install pinned settings checker
        run: |
          set -euo pipefail
          bun_version=1.4.0
          case "$(uname -m)" in
            x86_64) bun_arch=x64; bun_sha=2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452 ;;
            aarch64) bun_arch=aarch64; bun_sha=4b1a332ee861983eb93bcfe6f770fff94e3e31b2c388bdaea3c8ed35e58eed0e ;;
            *)
              echo "::error::No pinned Bun binary for runner architecture $(uname -m)"
              exit 1
              ;;
          esac
          bun_archive="$RUNNER_TEMP/bun.zip"
          bun_root="$RUNNER_TEMP/standards-bin"
          curl -sfLo "$bun_archive" "https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-${bun_arch}.zip"
          echo "$bun_sha  $bun_archive" | sha256sum --check --quiet
          mkdir "$bun_root"
          unzip -q "$bun_archive" -d "$bun_root"
          install -m 0755 "$bun_root/bun-linux-${bun_arch}/bun" "$bun_root/bun"

          standards_version=0.21.0
          standards_sha=afb8576434e62730e06d30d8249b1d275f586a874826ad7b50fe5e4d1b32b0da0e4adea176c6151160fc50a8ac049bab91095d18867b2a2544f40408f9e8f8ff
          standards_archive="$RUNNER_TEMP/standards.tgz"
          cli_root="$RUNNER_TEMP/standards-cli"
          mkdir -p "$cli_root/package"
          curl -sfLo "$standards_archive" "https://registry.npmjs.org/@davidvornholt/standards/-/standards-${standards_version}.tgz"
          echo "$standards_sha  $standards_archive" | sha512sum --check --quiet
          tar -xzf "$standards_archive" -C "$cli_root/package" --strip-components=1

          yaml_version=2.9.0
          yaml_sha=d80be1357de66fccdde99cbb20d4ed4a9975175e475ba5a7aa3d2cad696428b729625fe03083098b2b86ab629e236605c543e376507edcb735d2c78c2ed2f870
          yaml_archive="$RUNNER_TEMP/yaml.tgz"
          mkdir -p "$cli_root/node_modules/yaml"
          curl -sfLo "$yaml_archive" "https://registry.npmjs.org/yaml/-/yaml-${yaml_version}.tgz"
          echo "$yaml_sha  $yaml_archive" | sha512sum --check --quiet
          tar -xzf "$yaml_archive" -C "$cli_root/node_modules/yaml" --strip-components=1

      # Issues read is what declared-label reads need in a private repository;
      # every other setting the gate compares rides on the implicit Metadata
      # read every workflow token carries. REST withholds two things from this
      # token: repository merge settings, which it serves only to write-level
      # viewers, and ruleset bypass actors, which it serves only to a
      # user-scoped token holding repository Administration read — never to an
      # installation token, at any permission level. The CLI reads merge
      # settings over GraphQL and verifies a declared-empty bypass list through
      # the GraphQL bypass-actor count. A declared non-empty bypass list fails
      # closed until the check is re-run locally with admin auth. The retired
      # PAT was user-scoped and did see those actor lists over REST, so that
      # case is a deliberate, disclosed narrowing rather than a property of
      # GitHub's API; no credential CI can safely hold recovers it.
      - name: Check GitHub settings
        env:
          SETTINGS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$SETTINGS_TOKEN" ] || [[ "$SETTINGS_TOKEN" == *$'\n'* ]] || [[ "$SETTINGS_TOKEN" == *$'\r'* ]]; then
            echo "::error::Resolved GitHub settings token must be non-empty and single-line"
            exit 1
          fi
          cd "$RUNNER_TEMP/standards-cli"
          GH_TOKEN="$SETTINGS_TOKEN" "$RUNNER_TEMP/standards-bin/bun" \
            package/src/cli.ts github --check --dir "$GITHUB_WORKSPACE"

      - name: Require all standards gates
        env:
          IS_SOURCE_REPOSITORY: ${{ github.repository == 'davidvornholt/standards' }}
          NIX_DISCOVERY_RESULT: ${{ needs.nix-discovery.result }}
          NIX_RESULT: ${{ needs.nix.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          case "$IS_SOURCE_REPOSITORY" in
            true)
              expected_nix_result=success
              ;;
            false)
              expected_nix_result=skipped
              ;;
            *)
              echo "::error::Unexpected source-repository mode (is-source-repository=$IS_SOURCE_REPOSITORY)"
              exit 1
              ;;
          esac
          if [ "$QUALITY_RESULT" != success ]; then
            echo "::error::Standards gates did not all succeed (quality=$QUALITY_RESULT, nix-discovery=$NIX_DISCOVERY_RESULT, nix=$NIX_RESULT)"
            exit 1
          fi
          if [ "$NIX_DISCOVERY_RESULT" != "$expected_nix_result" ] || [ "$NIX_RESULT" != "$expected_nix_result" ]; then
            echo "::error::Nix gates did not match the repository mode (is-source-repository=$IS_SOURCE_REPOSITORY, expected=$expected_nix_result, nix-discovery=$NIX_DISCOVERY_RESULT, nix=$NIX_RESULT)"
            exit 1
          fi
